    title: Validation
    status: not_started
    note: Truth set from the haplotype-resolved assemblies; downsampling to 15x, 5x and 2x.
  - id: "3"
    title: Scale-out
    status: not_started
    note: Alignment and depth on Hyak ckpt-all, one BioProject batch at a time.
  - id: "4"
