# Where each phase of PLAN.md section 5 stands, shown on the dashboard.
# status: done | in_progress | not_started. Edit `note` and `status` as work moves.
version: "0.1.0"
phases:
  - id: "0"
    title: Inventory
    status: in_progress
    note: ENA run inventory taken 2026-11-25; curated metadata/samples.tsv and literature review still to do.
